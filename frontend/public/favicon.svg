<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D1FF" />
      <stop offset="100%" stop-color="#6C5DD3" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="15" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Outer Ring -->
  <circle cx="256" cy="256" r="240" stroke="url(#gradient)" stroke-width="20" opacity="0.2" />
  
  <!-- Spinning Elements (Static Representation) -->
  <g transform="translate(256 256)">
    <rect x="-160" y="-160" width="320" height="320" rx="40" stroke="url(#gradient)" stroke-width="15" fill="none" transform="rotate(45)" filter="url(#glow)"/>
    
    <!-- Core Vault 'X' -->
    <path d="M-60 -60 L60 60 M60 -60 L-60 60" stroke="white" stroke-width="25" stroke-linecap="round" />
    <rect x="-20" y="-20" width="40" height="40" fill="#00D1FF" rx="5" />
  </g>
</svg>
